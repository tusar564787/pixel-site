<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EARN WITH SANJU</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:#1e293b;
width:100%;
max-width:420px;
border-radius:20px;
padding:30px;
text-align:center;
box-shadow:0 0 20px rgba(0,255,150,.2);
}

img{
width:120px;
height:120px;
border-radius:50%;
object-fit:cover;
border:4px solid #22c55e;
margin-bottom:15px;
}

h1{
font-size:28px;
margin-bottom:10px;
}

p{
color:#cbd5e1;
margin-bottom:20px;
}

#timer{
font-size:30px;
font-weight:bold;
color:#22c55e;
margin:15px 0;
}

a.button{
display:block;
background:#22c55e;
color:#fff;
text-decoration:none;
padding:15px;
border-radius:10px;
font-size:18px;
font-weight:bold;
margin-top:20px;
}

a.button:hover{
background:#16a34a;
}
</style>

</head>
<body>

<div class="card">

<img src="profile.jpg" alt="Profile">

<h1>𝗘𝗔𝗥𝗡 𝗪𝗜𝗧𝗛 𝗦𝗔𝗡𝗝𝗨</h1>

<p>Welcome to our community.</p>

<div id="timer">00:30</div>

<a class="button" href="https://t.me/+Th0VfpFnsc44NTY1" target="_blank">
JOIN NOW
</a>

</div>

<script>
let time=30;
const timer=document.getElementById("timer");

setInterval(()=>{
if(time>0){
time--;
}
let sec=String(time).padStart(2,"0");
timer.innerHTML="00:"+sec;
},1000);
</script>

</body>
</html>
